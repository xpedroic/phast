<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Nueva pestaña</title>
  <link rel="icon" href="img/phast.png">
  <link rel="stylesheet" href="css/common.css">
  <style>
    main {
      display: flex; flex-direction: column; align-items: center;
      padding-top: 22vh; gap: 28px;
    }
    .logo { display: flex; align-items: center; gap: 14px; user-select: none; }
    .logo img { width: 64px; height: 64px; }
    .logo span { font-size: 44px; font-weight: 600; letter-spacing: -1px; }
    form { width: min(584px, 90vw); }
    .search {
      display: flex; align-items: center; gap: 12px;
      height: 48px; padding: 0 20px; border-radius: 24px;
      background: var(--surface); border: 1px solid transparent;
    }
    .search:hover, .search:focus-within { background: var(--bg); box-shadow: var(--shadow); border-color: var(--border); }
    .search svg { flex: none; fill: var(--text-2); }
    .search input {
      flex: 1; border: 0; outline: 0; background: transparent;
      color: var(--text); font: inherit; font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="img/phast.png" alt=""><span>Phast</span></div>
    <form id="form" autocomplete="off">
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="q" type="text" placeholder="Busca en la web o escribe una URL" aria-label="Buscar">
      </label>
    </form>
  </main>
  <script src="js/phast.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = document.getElementById("q").value.trim();
      if (text) phast.send("navigate", { text });
    });
  </script>
</body>
</html>
