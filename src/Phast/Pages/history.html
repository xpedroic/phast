<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Historial</title>
  <link rel="icon" href="img/phast.png">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/list.css">
</head>
<body>
  <header>
    <img src="img/phast.png" alt="">
    <h1>Historial</h1>
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input id="search" type="search" placeholder="Buscar en el historial">
    </label>
    <div class="spacer"></div>
    <button class="btn" id="clearBtn">Borrar datos de navegación</button>
  </header>
  <main>
    <div class="selection" id="selection"><span id="selCount"></span><div class="spacer"></div>
      <button class="btn" id="selCancel">Cancelar</button><button class="btn" id="selDelete">Eliminar</button></div>
    <div id="list"></div>
    <button class="btn more" id="more" hidden>Mostrar más</button>
  </main>

  <dialog id="clearDialog">
    <h2>Borrar datos de navegación</h2>
    <label>Intervalo de tiempo
      <select id="range">
        <option value="hour">Última hora</option><option value="day">Últimas 24 horas</option>
        <option value="week">Últimos 7 días</option><option value="month">Últimas 4 semanas</option>
        <option value="all" selected>Desde siempre</option>
      </select></label>
    <label><input type="checkbox" value="history" checked> Historial de navegación</label>
    <label><input type="checkbox" value="cookies" checked> Cookies y otros datos de sitios (cierra tus sesiones)</label>
    <label><input type="checkbox" value="cache" checked> Imágenes y archivos en caché</label>
    <label><input type="checkbox" value="downloads"> Lista de descargas (los archivos no se borran)</label>
    <label><input type="checkbox" value="passwords"> Contraseñas y datos de autocompletar</label>
    <div class="actions"><button class="btn" id="cancelClear">Cancelar</button><button class="btn primary" id="doClear">Borrar datos</button></div>
  </dialog>
  <div class="toast" id="toast"></div>

  <script src="js/phast.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
